name: CI

on:
  push:
    branches:
      - main
      - "phase/**"
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run check
      - run: npm test

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg AARAST_GIT_REVISION="${GITHUB_SHA}" backend
      - run: docker build --build-arg AARAST_GIT_REVISION="${GITHUB_SHA}" --build-arg VITE_API_BASE_URL="https://aarast-api.shadowgardn.com" admin-web

  # Boots the real compiled backend against real Postgres + Redis and runs
  # all registered smoke suites end-to-end — the same command used before releases.
  backend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Boot isolated smoke infrastructure
        working-directory: .
        run: |
          docker compose up -d --wait db redis media
          docker compose run --rm --no-deps media-init
      - name: Run all managed smoke suites
        run: npm run smoke:all
      - name: Run managed admin runtime smoke
        working-directory: admin-web
        run: npm run smoke:admin-runtime
      - name: Stop isolated smoke infrastructure
        if: always()
        working-directory: .
        run: docker compose down --remove-orphans

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run smoke:honesty
      - run: npm run smoke:routes

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Golden PNGs are generated on Windows; Linux rasterizes fonts
      # differently, so golden-tagged tests only run locally.
      - run: flutter test --exclude-tags golden

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/docs-sync.mjs --check
      - run: node scripts/docs-verify.mjs

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so leaked-then-deleted secrets are still caught.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high
        working-directory: backend
      - run: npm audit --audit-level=high
        working-directory: admin-web
