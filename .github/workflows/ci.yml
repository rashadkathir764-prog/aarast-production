name: CI

on:
  push:
    branches:
      - main
      - "phase/**"
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run check
      - run: npm test

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg AARAST_GIT_REVISION="${GITHUB_SHA}" backend
      - run: docker build --build-arg AARAST_GIT_REVISION="${GITHUB_SHA}" --build-arg VITE_API_BASE_URL="https://aarast-api.shadowgardn.com" admin-web

  # Boots the real compiled backend against real Postgres + Redis and runs
  # all registered smoke suites end-to-end — the same command used before releases.
  backend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aarast_ci
          POSTGRES_USER: aarast
          POSTGRES_PASSWORD: aarast_ci_password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U aarast -d aarast_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://aarast:aarast_ci_password@127.0.0.1:5432/aarast_ci?schema=public
      JWT_SECRET: ci-smoke-secret
      AUTH_LOGIN_THROTTLE_PEPPER: ci-separate-login-throttle-pepper
      REDIS_URL: redis://127.0.0.1:6379
      READINESS_REQUIRE_MEDIA: "true"
      AARAST_MEDIA_ENDPOINT: http://127.0.0.1:9000
      AARAST_MEDIA_SIGNED_ENDPOINT: http://127.0.0.1:9000
      AARAST_MEDIA_BUCKET: aarast-media
      AARAST_MEDIA_PUBLIC_BASE_URL: http://127.0.0.1:9000/aarast-media
      AARAST_MEDIA_REGION: us-east-1
      AARAST_MEDIA_FORCE_PATH_STYLE: "true"
      AARAST_MEDIA_ACCESS_KEY_ID: aarast-ci-media-key
      AARAST_MEDIA_SECRET_ACCESS_KEY: aarast-ci-media-secret-change-me
      AUTH_OTP_MODE: dev
      PORT: 3115
      SMOKE_BASE_URL: http://127.0.0.1:3115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npx prisma migrate deploy
      - name: Boot private S3-compatible media fixture
        run: |
          docker run -d --name aarast-ci-media -p 9000:9000 \
            -e MINIO_ROOT_USER=aarast-ci-media-key \
            -e MINIO_ROOT_PASSWORD=aarast-ci-media-secret-change-me \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          docker run --rm --network host --entrypoint sh \
            minio/mc:RELEASE.2025-07-21T05-28-08Z \
            -c "mc alias set local http://127.0.0.1:9000 aarast-ci-media-key aarast-ci-media-secret-change-me && mc mb --ignore-existing local/aarast-media && mc anonymous set download local/aarast-media/user-avatar && mc anonymous set download local/aarast-media/provider-logo && mc anonymous set download local/aarast-media/provider-cover && mc anonymous set download local/aarast-media/service-image"
      - name: Boot backend and run all smoke suites
        run: |
          node dist/main.js &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:3115/health && break
            sleep 1
          done
          node scripts/smoke/all-smoke.js
          ADMIN_SMOKE_DATABASE_URL="$DATABASE_URL" node ../admin-web/scripts/admin-runtime-smoke.mjs

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run smoke:honesty
      - run: npm run smoke:routes

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Golden PNGs are generated on Windows; Linux rasterizes fonts
      # differently, so golden-tagged tests only run locally.
      - run: flutter test --exclude-tags golden

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/docs-sync.mjs --check
      - run: node scripts/docs-verify.mjs

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so leaked-then-deleted secrets are still caught.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high
        working-directory: backend
      - run: npm audit --audit-level=high
        working-directory: admin-web
