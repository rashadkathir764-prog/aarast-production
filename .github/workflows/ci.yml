name: CI

on:
  push:
    branches:
      - main
      - "phase/**"
      - "staging/**"
  pull_request:

jobs:
  staging-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: docker compose --env-file deploy/staging/.env.example -f deploy/staging/docker-compose.yml -f deploy/staging/docker-compose.build.yml config --quiet
      - run: node --test deploy/staging/staging-contract.test.mjs deploy/staging/public-site/build.test.mjs admin-web/scripts/staging-build-origin.contract.mjs

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The architecture closure gate verifies its recorded lineage
          # commits are real ancestors of HEAD, which needs full history.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run check
      - run: npm run architecture
      - run: npm test

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --tag "aarast-backend:${GITHUB_SHA}" --build-arg AARAST_GIT_REVISION="${GITHUB_SHA}" backend
      - run: docker build --tag "aarast-admin-web:${GITHUB_SHA}" --build-arg AARAST_GIT_REVISION="${GITHUB_SHA}" --build-arg VITE_API_BASE_URL="https://aarast-api.shadowgardn.com" admin-web
      - name: Generate candidate-bound CycloneDX SBOMs
        run: |
          mkdir -p "${RUNNER_TEMP}/sbom"
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            image --format cyclonedx "aarast-backend:${GITHUB_SHA}" \
            > "${RUNNER_TEMP}/sbom/backend-${GITHUB_SHA}.cdx.json"
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            image --format cyclonedx "aarast-admin-web:${GITHUB_SHA}" \
            > "${RUNNER_TEMP}/sbom/admin-web-${GITHUB_SHA}.cdx.json"
      - name: Reject HIGH or CRITICAL candidate vulnerabilities
        run: |
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            image --exit-code 1 --severity HIGH,CRITICAL "aarast-backend:${GITHUB_SHA}"
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            image --exit-code 1 --severity HIGH,CRITICAL "aarast-admin-web:${GITHUB_SHA}"
      - name: Upload candidate-bound SBOMs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ github.sha }}
          path: ${{ runner.temp }}/sbom
          if-no-files-found: error

  # Boots the real compiled backend against real Postgres + Redis and runs
  # all registered smoke suites end-to-end — the same command used before releases.
  backend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Boot isolated smoke infrastructure
        working-directory: .
        run: |
          docker compose up -d --wait db redis media
          docker compose run --rm --no-deps media-init
      - name: Run all managed smoke suites
        run: npm run smoke:all
      - name: Run managed admin runtime smoke
        working-directory: admin-web
        run: npm run smoke:admin-runtime
      - name: Stop isolated smoke infrastructure
        if: always()
        working-directory: .
        run: docker compose down --remove-orphans

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm run test:architecture
      - run: npm run architecture
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke:honesty
      - run: npm run smoke:routes
      - run: npm run test:container-config

  # Mobile tests run in three zones: UTC, Yemen (no DST) and a DST zone behind
  # UTC, so date logic cannot pass by accident in one zone. Static checks run
  # once (UTC). Golden-tagged tests stay excluded until the owner redraws the 20
  # goldens on Windows; the Windows golden job, the emulator job and the signed
  # AAB build are the next CI steps (STATUS.md, RA-TS-20).
  mobile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz:
          - UTC
          - Asia/Aden
          - America/Los_Angeles
    env:
      TZ: ${{ matrix.tz }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true
      - run: node --test ../scripts/check-mobile-boundaries.test.mjs
        if: matrix.tz == 'UTC'
      - run: node ../scripts/check-mobile-boundaries.mjs --strict
        if: matrix.tz == 'UTC'
      - run: flutter pub get
      - run: flutter analyze
        if: matrix.tz == 'UTC'
      # Golden PNGs are generated on Windows; Linux rasterizes fonts
      # differently, so golden-tagged tests only run locally.
      - run: flutter test --exclude-tags golden

  # The same contract set as `scripts/gates.mjs` ("deploy and supply-chain
  # contracts"). The ubuntu runner has Docker, which direct-ip-contract needs.
  deploy-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node --test 'deploy/**/*.test.mjs' scripts/check-deploy-encoding.test.mjs scripts/supply-chain-contract.test.mjs

  # Runs the real Gradle release guard (no AAB build, no signing material).
  android-release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Fetch the pinned Gradle distribution
        run: |
          version="$(sed -n 's/.*gradle-\([0-9.]*\)-all\.zip/\1/p' mobile/android/gradle/wrapper/gradle-wrapper.properties)"
          curl -fsSLO "https://services.gradle.org/distributions/gradle-${version}-bin.zip"
          echo "$(curl -fsSL "https://services.gradle.org/distributions/gradle-${version}-bin.zip.sha256")  gradle-${version}-bin.zip" | sha256sum --check
          unzip -q "gradle-${version}-bin.zip" -d "${RUNNER_TEMP}"
          echo "GRADLE_HOME=${RUNNER_TEMP}/gradle-${version}" >> "$GITHUB_ENV"
      - run: node scripts/test-android-release-config.mjs

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/docs-sync.mjs --check
      - run: node scripts/docs-verify.mjs
      - run: node --test scripts/walks/process-ownership.test.mjs

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so leaked-then-deleted secrets are still caught.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high
        working-directory: backend
      - run: npm audit --audit-level=high
        working-directory: admin-web
