name: aarast-release-images

services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        AARAST_GIT_REVISION: ${AARAST_GIT_REVISION:?AARAST_GIT_REVISION is required}
    image: aarast-backend:candidate-${AARAST_GIT_REVISION:?AARAST_GIT_REVISION is required}

  admin-web:
    build:
      context: ../../admin-web
      dockerfile: Dockerfile
      args:
        AARAST_GIT_REVISION: ${AARAST_GIT_REVISION:?AARAST_GIT_REVISION is required}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://aarast-api.shadowgardn.com}
    image: aarast-admin-web:candidate-${AARAST_GIT_REVISION:?AARAST_GIT_REVISION is required}
