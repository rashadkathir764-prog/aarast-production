name: aarast-production

services:
  postgres:
    image: postgres:16-alpine
    container_name: aarast-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - aarast_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    # Memory limits keep one runaway service from OOM-killing the host.
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-1g}
    networks:
      - aarast_internal

  redis:
    image: redis:7-alpine
    container_name: aarast-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          # maxmemory 256mb + fragmentation headroom
          memory: 384m
    networks:
      - aarast_internal

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: aarast-postgres-backup-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      HEALTHCHECK_PORT: 8080
    volumes:
      - aarast_postgres_backups:/backups
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - aarast_internal

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: aarast-backend:prod
    container_name: aarast-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_ACCESS_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SENTRY_DSN: ${SENTRY_DSN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      AARAST_MEDIA_ENDPOINT: ${AARAST_MEDIA_ENDPOINT:-}
      AARAST_MEDIA_REGION: ${AARAST_MEDIA_REGION:-auto}
      AARAST_MEDIA_BUCKET: ${AARAST_MEDIA_BUCKET:-}
      AARAST_MEDIA_PUBLIC_BASE_URL: ${AARAST_MEDIA_PUBLIC_BASE_URL:-}
      AARAST_MEDIA_ACCESS_KEY_ID: ${AARAST_MEDIA_ACCESS_KEY_ID:-}
      AARAST_MEDIA_SECRET_ACCESS_KEY: ${AARAST_MEDIA_SECRET_ACCESS_KEY:-}
      AARAST_MEDIA_FORCE_PATH_STYLE: ${AARAST_MEDIA_FORCE_PATH_STYLE:-false}
      OTP_EXPIRES_MINUTES: ${OTP_EXPIRES_MINUTES:-5}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-1000}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      AARAST_EXPOSE_OTP_IN_SMOKE: "false"
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    ports:
      - "8093:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-768m}
    networks:
      - aarast_internal

  admin-web:
    build:
      context: ../../admin-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    image: aarast-admin-web:prod
    container_name: aarast-admin-web-prod
    restart: unless-stopped
    environment:
      API_ORIGIN: ${VITE_API_BASE_URL}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8094:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - aarast_internal

volumes:
  aarast_postgres_data:
  aarast_postgres_backups:

networks:
  aarast_internal:
    driver: bridge
