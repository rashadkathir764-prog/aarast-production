name: aarast-production

services:
  postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    container_name: aarast-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:?POSTGRES_OWNER_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD is required}
    volumes:
      - aarast_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    # Memory limits keep one runaway service from OOM-killing the host.
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-1g}
    networks:
      - aarast_internal

  postgres-roles:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    container_name: aarast-postgres-roles-prod
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_OWNER_USER: ${POSTGRES_OWNER_USER:?POSTGRES_OWNER_USER is required}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD is required}
      AARAST_DB_MIGRATOR_USER: ${AARAST_DB_MIGRATOR_USER:?AARAST_DB_MIGRATOR_USER is required}
      AARAST_DB_MIGRATOR_PASSWORD: ${AARAST_DB_MIGRATOR_PASSWORD:?AARAST_DB_MIGRATOR_PASSWORD is required}
      AARAST_DB_RUNTIME_USER: ${AARAST_DB_RUNTIME_USER:?AARAST_DB_RUNTIME_USER is required}
      AARAST_DB_RUNTIME_PASSWORD: ${AARAST_DB_RUNTIME_PASSWORD:?AARAST_DB_RUNTIME_PASSWORD is required}
    configs:
      - source: postgres_least_privilege
        target: /opt/aarast/postgres/least-privilege.sql
        mode: 0444
    entrypoint:
      - /bin/sh
      - -ec
      - |
        for role in "$${POSTGRES_OWNER_USER}" "$${AARAST_DB_MIGRATOR_USER}" "$${AARAST_DB_RUNTIME_USER}"; do
          case "$${role}" in
            ""|*[!A-Za-z0-9_]*)
              echo "FAIL: PostgreSQL role names must contain only letters, digits, and underscores" >&2
              exit 1
              ;;
          esac
        done
        if [ "$${POSTGRES_OWNER_USER}" = "$${AARAST_DB_MIGRATOR_USER}" ] ||
           [ "$${POSTGRES_OWNER_USER}" = "$${AARAST_DB_RUNTIME_USER}" ] ||
           [ "$${AARAST_DB_MIGRATOR_USER}" = "$${AARAST_DB_RUNTIME_USER}" ]; then
          echo "FAIL: PostgreSQL owner, migrator, and runtime roles must be distinct" >&2
          exit 1
        fi
        export PGPASSWORD="$${POSTGRES_OWNER_PASSWORD}"
        exec psql \
          --host=postgres \
          --username="$${POSTGRES_OWNER_USER}" \
          --dbname="$${POSTGRES_DB}" \
          --file=/opt/aarast/postgres/least-privilege.sql
    networks:
      - aarast_internal

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: aarast-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          # maxmemory 256mb + fragmentation headroom
          memory: 384m
    networks:
      - aarast_internal

  media:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: aarast-media-prod
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${AARAST_MEDIA_ROOT_USER:?AARAST_MEDIA_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${AARAST_MEDIA_ROOT_PASSWORD:?AARAST_MEDIA_ROOT_PASSWORD is required}
    volumes:
      - aarast_media_data:/data
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: ${MEDIA_MEMORY_LIMIT:-768m}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aarast-media-web.rule=Host(`${AARAST_MEDIA_HOST:-aarast-media.shadowgardn.com}`)"
      - "traefik.http.routers.aarast-media-web.entrypoints=web"
      - "traefik.http.routers.aarast-media-web.middlewares=redirect-to-https@file"
      - "traefik.http.routers.aarast-media-web.service=aarast-media"
      - "traefik.http.routers.aarast-media-secure.rule=Host(`${AARAST_MEDIA_HOST:-aarast-media.shadowgardn.com}`)"
      - "traefik.http.routers.aarast-media-secure.entrypoints=websecure"
      - "traefik.http.routers.aarast-media-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aarast-media-secure.service=aarast-media"
      - "traefik.http.services.aarast-media.loadbalancer.server.port=9000"
    networks:
      - aarast_internal

  media-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z@sha256:fb8f773eac8ef9d6da0486d5dec2f42f219358bcb8de579d1623d518c9ebd4cc
    container_name: aarast-media-init-prod
    depends_on:
      media:
        condition: service_healthy
    environment:
      AARAST_MEDIA_BUCKET: ${AARAST_MEDIA_BUCKET:?AARAST_MEDIA_BUCKET is required}
      MINIO_ROOT_USER: ${AARAST_MEDIA_ROOT_USER:?AARAST_MEDIA_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${AARAST_MEDIA_ROOT_PASSWORD:?AARAST_MEDIA_ROOT_PASSWORD is required}
      AARAST_MEDIA_ACCESS_KEY_ID: ${AARAST_MEDIA_ACCESS_KEY_ID:?AARAST_MEDIA_ACCESS_KEY_ID is required}
      AARAST_MEDIA_SECRET_ACCESS_KEY: ${AARAST_MEDIA_SECRET_ACCESS_KEY:?AARAST_MEDIA_SECRET_ACCESS_KEY is required}
    configs:
      - source: media_init_script
        target: /opt/aarast/media/init.sh
        mode: 0555
      - source: media_backend_policy
        target: /opt/aarast/media/backend-policy.sh
        mode: 0555
    entrypoint: ["/bin/sh", "/opt/aarast/media/init.sh"]
    networks:
      - aarast_internal

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16@sha256:a0103fbce0c48ccc7693ddbb2a2bfa733048db845354f635efef9e4566de185d
    container_name: aarast-postgres-backup-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:?POSTGRES_OWNER_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD is required}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      HEALTHCHECK_PORT: 8080
    volumes:
      - aarast_postgres_backups:/backups
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - aarast_internal

  migrate:
    image: ${AARAST_BACKEND_IMAGE_ID:?AARAST_BACKEND_IMAGE_ID is required}
    pull_policy: never
    container_name: aarast-migrate-prod
    restart: "no"
    depends_on:
      postgres-roles:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${AARAST_DB_MIGRATOR_DATABASE_URL:?AARAST_DB_MIGRATOR_DATABASE_URL is required}
      AARAST_DB_EXPECTED_ROLE: ${AARAST_DB_MIGRATOR_USER:?AARAST_DB_MIGRATOR_USER is required}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - /bin/sh
      - -ec
      - |
        node scripts/prod/assert-database-identity.cjs
        npx prisma migrate deploy
        npx prisma migrate status
    networks:
      - aarast_internal

  backend:
    image: ${AARAST_BACKEND_IMAGE_ID:?AARAST_BACKEND_IMAGE_ID is required}
    pull_policy: never
    container_name: aarast-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${AARAST_DB_RUNTIME_DATABASE_URL:?AARAST_DB_RUNTIME_DATABASE_URL is required}
      AARAST_DB_EXPECTED_ROLE: ${AARAST_DB_RUNTIME_USER:?AARAST_DB_RUNTIME_USER is required}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_ACCESS_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      READINESS_REQUIRE_REDIS: ${READINESS_REQUIRE_REDIS:-true}
      READINESS_REQUIRE_MEDIA: ${READINESS_REQUIRE_MEDIA:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      PUSH_NOTIFICATIONS_ENABLED: ${PUSH_NOTIFICATIONS_ENABLED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/aarast-firebase/service-account.json
      AARAST_MEDIA_ENDPOINT: ${AARAST_MEDIA_ENDPOINT:-http://media:9000}
      AARAST_MEDIA_SIGNED_ENDPOINT: ${AARAST_MEDIA_SIGNED_ENDPOINT:?AARAST_MEDIA_SIGNED_ENDPOINT is required}
      AARAST_MEDIA_REGION: ${AARAST_MEDIA_REGION:-us-east-1}
      AARAST_MEDIA_BUCKET: ${AARAST_MEDIA_BUCKET:-}
      AARAST_MEDIA_PUBLIC_BASE_URL: ${AARAST_MEDIA_PUBLIC_BASE_URL:-}
      AARAST_MEDIA_ACCESS_KEY_ID: ${AARAST_MEDIA_ACCESS_KEY_ID:-}
      AARAST_MEDIA_SECRET_ACCESS_KEY: ${AARAST_MEDIA_SECRET_ACCESS_KEY:-}
      AARAST_MEDIA_FORCE_PATH_STYLE: ${AARAST_MEDIA_FORCE_PATH_STYLE:-true}
      AUTH_OTP_MODE: ${AUTH_OTP_MODE:?AUTH_OTP_MODE is required}
      AUTH_LOGIN_THROTTLE_PEPPER: ${AUTH_LOGIN_THROTTLE_PEPPER:?AUTH_LOGIN_THROTTLE_PEPPER is required}
      OTP_EXPIRES_MINUTES: ${OTP_EXPIRES_MINUTES:-5}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_GLOBAL_DAILY_LIMIT: ${OTP_GLOBAL_DAILY_LIMIT:-150}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-1000}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      IDEMPOTENCY_RESERVATION_TTL_HOURS: ${IDEMPOTENCY_RESERVATION_TTL_HOURS:-24}
      IDEMPOTENCY_TTL_HOURS: ${IDEMPOTENCY_TTL_HOURS:-168}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_OTP_TEMPLATE_NAME: ${WHATSAPP_OTP_TEMPLATE_NAME:-}
      WHATSAPP_OTP_TEMPLATE_LANGUAGE: ${WHATSAPP_OTP_TEMPLATE_LANGUAGE:-}
      WHATSAPP_OTP_TIMEOUT_MS: ${WHATSAPP_OTP_TIMEOUT_MS:-10000}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      OPENWA_BASE_URL: ${OPENWA_BASE_URL:-}
      OPENWA_CREDENTIAL_FILE: /run/aarast/openwa.env
      OPENWA_OTP_TIMEOUT_MS: ${OPENWA_OTP_TIMEOUT_MS:-15000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    volumes:
      - ${OPENWA_PRODUCTION_CREDENTIAL_DIR:-aarast_openwa_production_credential}:/run/aarast:ro
      - ${AARAST_FIREBASE_CREDENTIAL_DIR:-aarast_firebase_credential}:/run/aarast-firebase:ro
    command:
      - /bin/sh
      - -ec
      - |
        node scripts/prod/assert-firebase-credentials.cjs
        node scripts/prod/assert-database-identity.cjs
        exec node dist/main.js
    ports:
      - "8093:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-768m}
    networks:
      - aarast_internal
      - aarast_otp_transport
      - aarast_monitoring

  admin-web:
    image: ${AARAST_ADMIN_WEB_IMAGE_ID:?AARAST_ADMIN_WEB_IMAGE_ID is required}
    pull_policy: never
    container_name: aarast-admin-web-prod
    restart: unless-stopped
    environment:
      API_ORIGIN: ${VITE_API_BASE_URL:-https://aarast-api.shadowgardn.com}
      ADMIN_PUBLIC_ORIGIN: ${ADMIN_PUBLIC_ORIGIN:?ADMIN_PUBLIC_ORIGIN is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8094:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - aarast_internal

  public-site:
    image: ${AARAST_PUBLIC_SITE_IMAGE_ID:?AARAST_PUBLIC_SITE_IMAGE_ID is required}
    pull_policy: never
    container_name: aarast-public-site-prod
    restart: unless-stopped
    ports:
      - "8095:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 64m
    networks:
      - aarast_internal

volumes:
  aarast_postgres_data:
  aarast_postgres_backups:
  aarast_media_data:
  aarast_openwa_production_credential:
  aarast_firebase_credential:

configs:
  postgres_least_privilege:
    file: ./postgres/least-privilege.sql
  media_init_script:
    file: ../media/init.sh
  media_backend_policy:
    file: ../media/backend-policy.sh

networks:
  aarast_internal:
    driver: bridge
  aarast_otp_transport:
    external: true
    name: ${OPENWA_DOCKER_NETWORK:-aarast_otp_staging_transport}
  aarast_monitoring:
    external: true
    name: ${AARAST_MONITORING_NETWORK:?AARAST_MONITORING_NETWORK is required}
