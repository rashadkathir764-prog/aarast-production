# Route alerts somewhere a human sees them. Until a receiver is
# configured this stack still gives you the Grafana dashboards and the
# firing-alert list in the Prometheus/Alertmanager UIs.
route:
  receiver: default
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    # Replace with a real channel, e.g. Telegram:
    #
    # telegram_configs:
    #   - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
    #     chat_id: -100123456789
    #     parse_mode: HTML
    #
    # or any webhook (Slack, Discord, custom):
    #
    # webhook_configs:
    #   - url: https://example.com/alert-hook
