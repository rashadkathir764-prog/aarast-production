  <body>
    <main class="invite-shell">
      <section class="invite-card" aria-labelledby="invite-title">
        <div class="brand-mark" aria-hidden="true">
          <span class="ring ring-one"></span>
          <span class="ring ring-two"></span>
          <span class="heart">♥</span>
        </div>
        <p class="eyebrow">اعّرست</p>
        <h1 id="invite-title">وصلك رابط دعوة خاص</h1>
        <p class="lead">
          افتح الدعوة في تطبيق اعّرست، ثم تحقق من رقم هاتفك قبل عرض أي تفاصيل.
        </p>
        <div class="privacy-note">
          <strong>الخصوصية أولًا</strong>
          <span>لا يعرض هذا الرابط اسم الخطة أو بيانات المشاركين للعامة.</span>
        </div>
        <a id="open-invite" class="open-button" href="#" rel="nofollow">
          فتح الدعوة في التطبيق
        </a>
        <p id="invite-status" class="status" role="status" aria-live="polite">
          إن لم يكن التطبيق مثبتًا، ثبّته ثم افتح الرابط مرة أخرى.
        </p>
      </section>
    </main>
