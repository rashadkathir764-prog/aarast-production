server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'" always;
    add_header_inherit merge;

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location ~* ^/(?:Dockerfile|docker-compose(?:\.[^/]+)?|nginx\.conf)$ {
        return 404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /.well-known/assetlinks.json {
        access_log off;
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        try_files /assetlinks.json =404;
    }

    # Apple association remains fail-closed until a real Apple Team ID exists.
    location = /.well-known/apple-app-site-association {
        return 404;
    }

    location ^~ /invites/ {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files /invite.html =404;
    }

    # A guest's personal RSVP link (V1 checklist 4.7). The edge proxy sends
    # /api/v1/public/rsvp/ to the API, so the page talks to its own origin.
    location ^~ /rsvp/ {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files /rsvp.html =404;
    }

    location = /rsvp.js {
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /rsvp.css {
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /invite.css {
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /invite.js {
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /invite-preview.png {
        access_log off;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location = /privacy {
        access_log off;
        add_header Cache-Control "public, max-age=300" always;
        try_files /privacy.html =404;
    }

    location = /privacy/ {
        access_log off;
        add_header Cache-Control "public, max-age=300" always;
        try_files /privacy.html =404;
    }

    location = /terms {
        access_log off;
        add_header Cache-Control "public, max-age=300" always;
        try_files /terms.html =404;
    }

    location = /terms/ {
        access_log off;
        add_header Cache-Control "public, max-age=300" always;
        try_files /terms.html =404;
    }

    # The app download page and its QR code (V1 checklist 6.4).
    location = /download {
        access_log off;
        add_header Cache-Control "public, max-age=300" always;
        try_files /download.html =404;
    }

    location = /download/ {
        access_log off;
        add_header Cache-Control "public, max-age=300" always;
        try_files /download.html =404;
    }

    location = /download.js {
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /qrcode-generator.js {
        access_log off;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location = /support {
        access_log off;
        add_header Cache-Control "public, max-age=300" always;
        try_files /support.html =404;
    }

    location = /support/ {
        access_log off;
        add_header Cache-Control "public, max-age=300" always;
        try_files /support.html =404;
    }

    location = /public.css {
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /assetlinks.json {
        return 404;
    }

    location / {
        return 404;
    }
}
