server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'" always;

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location ~* ^/(?:Dockerfile|docker-compose(?:\.[^/]+)?|nginx\.conf)$ {
        return 404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Association identities stay fail-closed until final store signing adds
    # the real Android certificate and Apple team identifiers. Falling through
    # to index.html here would be a misleading successful HTML response.
    location = /.well-known/assetlinks.json {
        return 404;
    }

    location = /.well-known/apple-app-site-association {
        return 404;
    }

    location ^~ /invites/ {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'" always;
        try_files /invite.html =404;
    }

    location = /invite.css {
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /invite.js {
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /invite-preview.png {
        access_log off;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
