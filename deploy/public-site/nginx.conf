# 6a: the token of a guest's RSVP link, for the page's SSI include of its
# preview; anything else is "none", which answers nothing.
map $request_uri $rsvp_token {
    "~^/rsvp/(?<rsvp_link>[A-Za-z0-9_-]{43})(?:\?.*)?$" $rsvp_link;
    default none;
}

# 6c: the origin the participant invite page names in its preview tags: the
# host it is served on (the IP until the domain exists). Only a plain host
# name passes, so a forged Host cannot write markup; a forged but plain one
# only changes the forger's own uncached answer (no-store), and on AWS Caddy
# routes nothing but its own site addresses here.
map $host $invite_origin {
    "~^(?<invite_host>[a-z0-9.-]{1,253})$" https://$invite_host;
    default https://aarast.shadowgardn.com;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # D83: the RSVP page shows the plan's card photo. 6a: it loads the link's
    # own route ('self'), which redirects to a short signed read on the media
    # bucket (the AWS bucket host, or the interim media host); nothing else
    # loads from outside.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; img-src 'self' https://*.s3.eu-central-1.amazonaws.com https://aarast-media.shadowgardn.com; style-src 'self'; script-src 'self'" always;
    add_header_inherit merge;

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location ~* ^/(?:Dockerfile|docker-compose(?:\.[^/]+)?|nginx\.conf)$ {
        return 404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /.well-known/assetlinks.json {
        access_log off;
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        try_files /assetlinks.json =404;
    }

    # Apple association remains fail-closed until a real Apple Team ID exists.
    location = /.well-known/apple-app-site-association {
        return 404;
    }

    location ^~ /invites/ {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        # 6c: the page keeps the canonical origin (the staging build rewrites
        # it); each answer names the host it was served on instead.
        sub_filter 'https://aarast.shadowgardn.com' $invite_origin;
        sub_filter_once off;
        try_files /invite.html =404;
    }

    # A guest's personal RSVP link (V1 checklist 4.7). The edge proxy sends
    # /api/v1/public/rsvp/ to the API, so the page talks to its own origin.
    # 6a: SSI puts the link's own Open Graph tags in the page's head, so a
    # link crawler that runs no script reads the invitation (rsvp.html).
    location ^~ /rsvp/ {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        ssi on;
        try_files /rsvp.html =404;
    }

    # 6a: the API's preview of one RSVP link, for that page's head only. A
    # dead link (204), an error or a slow API leaves the generic tags: an
    # empty answer makes SSI use the page's stub.
    location ~ "^/__rsvp_preview/([A-Za-z0-9_-]{43})$" {
        internal;
        access_log off;
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 2s;
        proxy_pass http://backend:3000/api/v1/public/rsvp/$1/preview;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 400 404 429 500 502 503 504 = @rsvp_preview_none;
    }

    location = /__rsvp_preview/none {
        internal;
        return 204;
    }

    location @rsvp_preview_none {
        return 204;
    }

    location = /rsvp.js {
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /rsvp.css {
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /invite.css {
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /invite.js {
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /invite-preview.png {
        access_log off;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location = /privacy {
        access_log off;
        add_header Cache-Control "public, max-age=300" always;
        try_files /privacy.html =404;
    }

    location = /privacy/ {
        access_log off;
        add_header Cache-Control "public, max-age=300" always;
        try_files /privacy.html =404;
    }

    location = /terms {
        access_log off;
        add_header Cache-Control "public, max-age=300" always;
        try_files /terms.html =404;
    }

    location = /terms/ {
        access_log off;
        add_header Cache-Control "public, max-age=300" always;
        try_files /terms.html =404;
    }

    # The app download page and its QR code (V1 checklist 6.4).
    location = /download {
        access_log off;
        add_header Cache-Control "public, max-age=300" always;
        try_files /download.html =404;
    }

    location = /download/ {
        access_log off;
        add_header Cache-Control "public, max-age=300" always;
        try_files /download.html =404;
    }

    location = /download.js {
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /qrcode-generator.js {
        access_log off;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location = /support {
        access_log off;
        add_header Cache-Control "public, max-age=300" always;
        try_files /support.html =404;
    }

    location = /support/ {
        access_log off;
        add_header Cache-Control "public, max-age=300" always;
        try_files /support.html =404;
    }

    location = /public.css {
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /assetlinks.json {
        return 404;
    }

    location / {
        return 404;
    }
}
