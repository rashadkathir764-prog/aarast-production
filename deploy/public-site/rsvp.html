<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="theme-color" content="#064b47">
    <title>دعوة عرس</title>
    <meta name="description" content="دعوة خاصة لحضور عرس. رد من هنا بضغطة.">
    <meta property="og:locale" content="ar_YE">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="اعّرست">
    <meta property="og:title" content="دعوة عرس">
    <meta property="og:description" content="يسعدنا حضورك. رد من الرابط بضغطة.">
    <link rel="stylesheet" href="/rsvp.css">
    <script src="/rsvp.js" defer></script>
  </head>
  <body>
    <main class="rsvp-shell" aria-live="polite">
      <section class="rsvp-card" aria-labelledby="rsvp-title">
        <p id="rsvp-greeting" class="rsvp-greeting"></p>
        <h1 id="rsvp-title">نفتح الدعوة…</h1>
        <p id="rsvp-invite-line" class="rsvp-invite-line"></p>
        <dl id="rsvp-details" class="rsvp-details" hidden>
          <div id="rsvp-date-row">
            <dt>الموعد</dt>
            <dd>
              <span id="rsvp-date"></span>
              <span id="rsvp-hijri" class="rsvp-hijri"></span>
            </dd>
          </div>
          <div id="rsvp-place-row">
            <dt>المكان</dt>
            <dd id="rsvp-place"></dd>
          </div>
        </dl>
      </section>

      <section id="rsvp-answer" class="rsvp-answer" hidden aria-labelledby="rsvp-companions-label">
        <p id="rsvp-companions-label" class="rsvp-question">كم معك؟</p>
        <div id="rsvp-companions" class="rsvp-chips" role="group" aria-labelledby="rsvp-companions-label"></div>
        <button id="rsvp-yes" class="rsvp-yes" type="button">إن شاء الله حاضر</button>
        <button id="rsvp-no" class="rsvp-no" type="button">أعتذر</button>
        <p id="rsvp-status" class="rsvp-status" role="status"></p>
      </section>

      <p class="rsvp-footnote">ما تحتاج تنزل أي تطبيق.</p>
    </main>
  </body>
</html>
