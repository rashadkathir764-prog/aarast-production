name: aarast

services:
  db:
    image: postgres:16-alpine
    container_name: aarast-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aarast
      POSTGRES_USER: aarast
      POSTGRES_PASSWORD: aarast_dev_password
    ports:
      - "5433:5432"
    volumes:
      - aarast_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aarast -d aarast"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: aarast-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  media:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: aarast-media
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aarast-local-media-key
      MINIO_ROOT_PASSWORD: aarast-local-media-secret-change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aarast_media_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  media-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: aarast-media-init
    depends_on:
      media:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://media:9000 aarast-local-media-key aarast-local-media-secret-change-me &&
      mc mb --ignore-existing local/aarast-media &&
      mc anonymous set download local/aarast-media/user-avatar &&
      mc anonymous set download local/aarast-media/provider-logo &&
      mc anonymous set download local/aarast-media/provider-cover &&
      mc anonymous set download local/aarast-media/service-image
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: aarast-backend:local
    container_name: aarast-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://aarast:aarast_dev_password@db:5432/aarast?schema=public
      JWT_SECRET: aarast-local-dev-secret-change-me
      AUTH_LOGIN_THROTTLE_PEPPER: aarast-local-login-throttle-pepper-change-me
      REDIS_URL: redis://redis:6379
      READINESS_REQUIRE_REDIS: "true"
      READINESS_REQUIRE_MEDIA: "true"
      AARAST_MEDIA_ENDPOINT: http://media:9000
      AARAST_MEDIA_SIGNED_ENDPOINT: http://127.0.0.1:9000
      AARAST_MEDIA_BUCKET: aarast-media
      AARAST_MEDIA_PUBLIC_BASE_URL: http://127.0.0.1:9000/aarast-media
      AARAST_MEDIA_REGION: us-east-1
      AARAST_MEDIA_FORCE_PATH_STYLE: "true"
      AARAST_MEDIA_ACCESS_KEY_ID: aarast-local-media-key
      AARAST_MEDIA_SECRET_ACCESS_KEY: aarast-local-media-secret-change-me
    ports:
      - "3115:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  aarast_db_data:
  aarast_media_data:
