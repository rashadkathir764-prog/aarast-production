<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>رحلة اعّرست</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@500;700;800&display=swap">
<style>
/* Layout: a guide column beside a real-size phone on wide screens; on a phone the prototype fills the screen and the guide opens as a sheet. */
:root{
  --pg-bg:#F2ECED; --pg-fg:#2D1A1E; --pg-muted:#6F6467; --pg-line:#E2D8DA; --pg-card:#FFFFFF; --pg-accent:#800020; --pg-chip:#F8E8EC; --frame:#1C1416;
  --a-canvas:#FFFEFD; --a-paper:#FFFFFF; --a-quiet:#F7F3F3; --a-ink:#2D1A1E; --a-text:#352D30; --a-muted:#6F6467; --a-faint:#9A8F91; --a-line:#ECE5E6;
  --a-primary:#800020; --a-primary-dk:#5A0015; --a-primary-soft:#F8E8EC; --a-on-primary:#FFFEFD; --a-on-primary-muted:#EFDCE1;
  --a-gold:#D9B15F; --a-gold-dk:#8A6A24; --a-gold-soft:#FBF3DE;
  --a-mint:#3F7A68; --a-mint-soft:#E7F2EE; --a-amber:#9A6128; --a-amber-soft:#F7EDDE; --a-danger:#B74452; --a-danger-soft:#F9E7EA; --a-cobalt:#4F6E84; --a-cobalt-soft:#EAF0F4;
  --f-display:'Tajawal','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Tajawal',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pg-bg:#171012;--pg-fg:#F3E9EB;--pg-muted:#B8A8AC;--pg-line:#3A2A2E;--pg-card:#221A1C;--pg-accent:#E9A9B7;--pg-chip:#3A2229;--frame:#000000;color-scheme:dark}}
:root[data-theme="dark"]{--pg-bg:#171012;--pg-fg:#F3E9EB;--pg-muted:#B8A8AC;--pg-line:#3A2A2E;--pg-card:#221A1C;--pg-accent:#E9A9B7;--pg-chip:#3A2229;--frame:#000000;color-scheme:dark}

html,body{height:100%}
body{background:var(--pg-bg);color:var(--pg-fg);font-family:var(--f-body)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pg-accent);outline-offset:2px}

.wrap{min-height:100%;display:flex;gap:40px;justify-content:center;align-items:flex-start;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* guide */
.guide{width:360px;flex:none;display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px)}
.g-brand{display:flex;flex-direction:column;gap:6px}
.g-brand h1{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.15;margin:0;text-wrap:balance}
.g-brand p{margin:0;color:var(--pg-muted);font-size:14px;line-height:1.7}
.g-sec{background:var(--pg-card);border:1px solid var(--pg-line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.g-sec h2{margin:0;font-family:var(--f-display);font-size:16px;font-weight:700}
.g-hint{margin:0;font-size:13px;color:var(--pg-muted);line-height:1.6}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stages button{font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--pg-line);color:var(--pg-fg)}
.stages button.on{background:var(--pg-accent);border-color:var(--pg-accent);color:var(--pg-card)}
.g-note .q{font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1.4;margin:0}
.g-note dl{margin:0;display:grid;gap:8px}
.g-note dt{font-size:12px;color:var(--pg-muted);font-weight:600}
.g-note dd{margin:0;font-size:14px;line-height:1.7}
.jump{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto}
.jump .grp{font-size:12px;color:var(--pg-muted);font-weight:600;padding:8px 4px 4px}
.jump button{text-align:right;font-size:14px;padding:7px 8px;border-radius:10px}
.jump button:hover{background:var(--pg-chip)}
.jump button.on{background:var(--pg-chip);color:var(--pg-accent);font-weight:600}

/* phone */
.phone{width:392px;height:830px;flex:none;border:11px solid var(--frame);border-radius:48px;overflow:hidden;position:relative;background:var(--a-canvas);box-shadow:0 30px 60px -30px rgba(45,26,30,.45)}
.app{position:relative;height:100%;display:flex;flex-direction:column;background:var(--a-canvas);color:var(--a-text);font-family:var(--f-body);font-size:15px}
.sbar{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:13px;font-weight:600;color:var(--a-ink)}
.sbar .r{display:flex;gap:6px;align-items:center}
.scr{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.pad{padding:0 16px 24px;display:flex;flex-direction:column;gap:14px}

.gtoggle{display:none}

@media (max-width:820px){
  .wrap{padding:0;gap:0;display:block}
  .guide{display:none}
  .phone{width:100%;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border:0;border-radius:0;box-shadow:none}
  .sbar{display:none}
  .gtoggle{display:flex;position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 10px);align-items:center;gap:6px;background:var(--a-ink);color:var(--a-canvas);font-size:12px;font-weight:600;padding:7px 11px;border-radius:999px;opacity:.92}
  .gsheet{position:fixed;inset:0;z-index:40;background:rgba(20,10,12,.5);display:flex;align-items:flex-end}
  .gsheet .panel{background:var(--pg-bg);width:100%;max-height:86dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
  .gsheet .guide{display:flex;width:100%;position:static}
}
.gsheet[hidden]{display:none}

/* app type */
.t-h1{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.25;color:var(--a-ink);margin:0;text-wrap:balance}
.t-h2{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.35;color:var(--a-ink);margin:0;text-wrap:balance}
.t-h3{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--a-ink);margin:0}
.t-body{font-size:14px;line-height:1.75;color:var(--a-muted);margin:0}
.t-small{font-size:12.5px;color:var(--a-muted);line-height:1.6}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.cur{font-size:.68em;font-weight:500;color:inherit;opacity:.75;margin-right:3px}

/* headers */
.hroot{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px}
.hroot .who{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;background:var(--a-primary-soft);color:var(--a-primary);flex:none}
.av.sm{width:30px;height:30px;font-size:12px}
.av.gold{background:var(--a-gold-soft);color:var(--a-gold-dk)}
.av.mint{background:var(--a-mint-soft);color:var(--a-mint)}
.av.cob{background:var(--a-cobalt-soft);color:var(--a-cobalt)}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--a-ink);position:relative}
.ibtn .dot{position:absolute;top:9px;left:10px;width:8px;height:8px;border-radius:50%;background:var(--a-danger);border:2px solid var(--a-canvas)}
.htitle{padding:4px 16px 10px}
.hsub{position:sticky;top:0;z-index:5;background:var(--a-canvas);display:flex;align-items:center;gap:6px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--a-line)}
.hsub .t{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--a-ink);flex:1}

/* top tabs */
.ttabs{position:sticky;top:0;z-index:5;background:var(--a-canvas);display:flex;gap:4px;padding:6px 12px 0;border-bottom:1px solid var(--a-line);overflow-x:auto;scrollbar-width:none}
.ttabs button{flex:1 0 auto;padding:10px 10px 11px;font-size:14px;font-weight:600;color:var(--a-muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ttabs button.on{color:var(--a-primary);border-color:var(--a-primary)}

/* stage strip */
.stage-strip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--a-quiet);text-align:right;width:100%}
.stage-strip .lbl{font-size:12px;color:var(--a-muted)}
.stage-strip .nm{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--a-ink)}
.stage-strip .dots{display:flex;gap:3px;margin-right:auto}
.stage-strip .dots i{width:7px;height:7px;border-radius:50%;background:var(--a-line)}
.stage-strip .dots i.d{background:var(--a-primary)}
.stage-strip .dots i.c{background:var(--a-gold);box-shadow:0 0 0 3px var(--a-gold-soft)}

/* cards */
.now{background:var(--a-primary);color:var(--a-on-primary);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.now .k{font-size:12.5px;color:var(--a-on-primary-muted);font-weight:600;display:flex;align-items:center;gap:6px}
.now h3{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.3;margin:0;color:var(--a-on-primary);text-wrap:balance}
.now p{margin:0;font-size:14px;line-height:1.7;color:var(--a-on-primary-muted)}
.now .acts{display:flex;gap:8px;flex-wrap:wrap}
.now.gold{background:var(--a-gold-soft);color:var(--a-ink)}
.now.gold .k,.now.gold p{color:var(--a-gold-dk)}
.now.gold h3{color:var(--a-ink)}
.now .ring{position:absolute;left:-40px;top:-40px;width:150px;height:150px;border-radius:50%;border:22px solid rgba(255,255,255,.07)}

.card{background:var(--a-paper);border:1px solid var(--a-line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.tap{text-align:right;width:100%}
.crow{display:flex;align-items:center;gap:12px}
.crow .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--a-quiet);color:var(--a-ink)}
.ic.p{background:var(--a-primary-soft);color:var(--a-primary)}
.ic.g{background:var(--a-gold-soft);color:var(--a-gold-dk)}
.ic.m{background:var(--a-mint-soft);color:var(--a-mint)}
.ic.a{background:var(--a-amber-soft);color:var(--a-amber)}
.ic.c{background:var(--a-cobalt-soft);color:var(--a-cobalt)}
.ic.d{background:var(--a-danger-soft);color:var(--a-danger)}
.chev{color:var(--a-faint);flex:none}

.month{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;border:1px dashed var(--a-gold);background:var(--a-gold-soft)}
.month .v{font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--a-ink)}
.month .l{font-size:12.5px;color:var(--a-gold-dk);font-weight:600}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px}
.link{font-size:13.5px;font-weight:600;color:var(--a-primary)}

.list{background:var(--a-paper);border:1px solid var(--a-line);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--a-line);width:100%;text-align:right}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.li .ttl{font-weight:600;color:var(--a-ink);font-size:14.5px}
.li .amt{font-weight:700;color:var(--a-ink);font-size:14.5px;white-space:nowrap}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--a-mint-soft);color:var(--a-mint)}
.pill.warn{background:var(--a-amber-soft);color:var(--a-amber)}
.pill.bad{background:var(--a-danger-soft);color:var(--a-danger)}
.pill.info{background:var(--a-cobalt-soft);color:var(--a-cobalt)}
.pill.p{background:var(--a-primary-soft);color:var(--a-primary)}
.pill.g{background:var(--a-gold-soft);color:var(--a-gold-dk)}
.pill.q{background:var(--a-quiet);color:var(--a-muted)}

.bar{height:7px;border-radius:999px;background:var(--a-quiet);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--a-primary);border-radius:999px}
.bar i.m{background:var(--a-mint)}
.bar i.a{background:var(--a-amber)}
.bar i.g{background:var(--a-gold)}
.now .bar{background:rgba(255,255,255,.18)}
.now .bar i{background:var(--a-gold)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;font-weight:600;font-size:15px}
.btn.pri{background:var(--a-primary);color:var(--a-on-primary)}
.btn.sec{background:var(--a-paper);color:var(--a-primary);border:1px solid var(--a-line)}
.btn.lite{background:rgba(255,255,255,.14);color:var(--a-on-primary)}
.btn.onp{background:var(--a-on-primary);color:var(--a-primary)}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:11px}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--a-line);font-size:13.5px;color:var(--a-text);background:var(--a-paper)}
.chip.on{background:var(--a-ink);border-color:var(--a-ink);color:var(--a-canvas)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--a-paper);border:1px solid var(--a-line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .l{font-size:12px;color:var(--a-muted)}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:17px;color:var(--a-ink)}

/* bottom nav */
.nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--a-line);background:var(--a-paper);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;font-weight:600;color:var(--a-faint);border-radius:14px}
.nav button.on{color:var(--a-primary)}
.nav button.on .nb{background:var(--a-primary-soft)}
.nav .nb{width:52px;height:30px;border-radius:999px;display:grid;place-items:center}
.fab{position:absolute;left:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));height:52px;padding:0 18px 0 16px;border-radius:18px;background:var(--a-ink);color:var(--a-canvas);display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;box-shadow:0 10px 24px -10px rgba(45,26,30,.6);z-index:6}
.actbar{flex:none;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--a-line);background:var(--a-paper);display:flex;flex-direction:column;gap:6px}

/* sheets, toast */
.ov{position:absolute;inset:0;background:rgba(30,15,18,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--a-canvas);width:100%;border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92%;overflow:auto}
.grab{width:40px;height:5px;border-radius:5px;background:var(--a-line);align-self:center}
.toast{position:absolute;top:44px;right:12px;left:12px;z-index:30;background:var(--a-ink);color:var(--a-canvas);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.6;display:flex;gap:10px;align-items:flex-start;box-shadow:0 12px 30px -12px rgba(0,0,0,.5);animation:tin .25s ease}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--a-ink)}
.inp{height:50px;border:1px solid var(--a-line);border-radius:14px;padding:0 14px;background:var(--a-paper);display:flex;align-items:center;gap:8px}
.inp input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:16px;color:var(--a-ink)}
.inp .suf{color:var(--a-muted);font-size:13px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--a-line);border-radius:16px;background:var(--a-paper);text-align:right;width:100%}
.opt.on{border-color:var(--a-primary);background:var(--a-primary-soft)}
.opt .grow{flex:1;display:flex;flex-direction:column;gap:2px}
.opt .ttl{font-weight:700;color:var(--a-ink)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--a-line);flex:none;display:grid;place-items:center}
.opt.on .radio{border-color:var(--a-primary)}
.opt.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--a-primary)}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--a-line);flex:none;display:grid;place-items:center;color:transparent}
.chk.on{background:var(--a-mint);border-color:var(--a-mint);color:#fff}
.sw{width:44px;height:26px;border-radius:999px;background:var(--a-line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:right .2s}
.sw.on{background:var(--a-mint)}
.sw.on::after{right:21px}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:4px;border-radius:4px;background:var(--a-line)}
.progress i.d{background:var(--a-primary)}

.offline{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--a-cobalt-soft);color:var(--a-cobalt);font-size:13px;font-weight:600}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 18px;border:1px dashed var(--a-line);border-radius:18px;background:var(--a-paper)}
.ph{border-radius:14px;background:linear-gradient(135deg,var(--a-primary-soft),var(--a-gold-soft));display:grid;place-items:center;color:var(--a-primary)}

.big-rifd{height:110px;border-radius:24px;background:var(--a-primary);color:var(--a-on-primary);display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--f-display);font-weight:800;font-size:24px;width:100%}
.keyamts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keyamts button{height:44px;border-radius:12px;border:1px solid var(--a-line);background:var(--a-paper);font-weight:700;color:var(--a-ink);font-size:14px}
.keyamts button.on{border-color:var(--a-primary);background:var(--a-primary-soft);color:var(--a-primary)}

.tl{display:flex;flex-direction:column}
.tl .st{display:flex;gap:12px;text-align:right;width:100%}
.tl .rail{display:flex;flex-direction:column;align-items:center;flex:none;width:26px}
.tl .node{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--a-line);background:var(--a-paper);color:var(--a-faint);font-size:12px;font-weight:700}
.tl .node.d{background:var(--a-primary);border-color:var(--a-primary);color:#fff}
.tl .node.c{background:var(--a-gold);border-color:var(--a-gold);color:var(--a-ink);box-shadow:0 0 0 4px var(--a-gold-soft)}
.tl .line{flex:1;width:2px;background:var(--a-line);min-height:16px}
.tl .line.d{background:var(--a-primary)}
.tl .body{padding:2px 0 18px;display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}

.inv{border-radius:20px;padding:22px 18px;text-align:center;background:var(--a-paper);border:1px solid var(--a-gold);display:flex;flex-direction:column;gap:8px;position:relative}
.inv::before{content:"";position:absolute;inset:6px;border:1px solid var(--a-gold-soft);border-radius:15px;pointer-events:none}
.inv .names{font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--a-primary)}

.cmp{display:grid;grid-template-columns:76px repeat(3,1fr);font-size:13px;border:1px solid var(--a-line);border-radius:16px;overflow:hidden;background:var(--a-paper)}
.cmp > div{padding:9px 7px;border-bottom:1px solid var(--a-line);min-width:0}
.cmp .h{font-weight:700;color:var(--a-ink);background:var(--a-quiet)}
.cmp .rl{color:var(--a-muted);font-size:12px;background:var(--a-quiet)}
.cmp .best{background:var(--a-mint-soft)}

.finish{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:30px 22px;background:var(--a-primary);color:var(--a-on-primary)}
.finish h1{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1.15;margin:0;color:var(--a-on-primary);text-wrap:balance}
.finish .goldline{width:64px;height:4px;border-radius:4px;background:var(--a-gold)}

.screen-in{animation:sin .22s ease}
@keyframes sin{from{opacity:.4;transform:translateX(-10px)}}
@media (prefers-reduced-motion:reduce){.screen-in,.toast{animation:none}.sw,.sw::after{transition:none}}

  if(TABS.includes(v)){ S.tab=v; S.view=v; S.hist=[]; }
  else S.view=v;
  S.sheet=null; render(true);
}
function back(){ const h=S.hist.pop(); if(h){S.view=h.view; S.tab=h.tab;} else {S.view=S.tab;} S.sheet=null; render(true); }
function toast(msg){ S.toast=msg; render(); clearTimeout(toast.t); toast.t=setTimeout(()=>{S.toast=null; render();},3200); }
function setStage(i){
  S.stage=i; S.hist=[]; S.tab='home';
  S.view = i===0 ? 'welcome' : 'home';
  if(i>=10){ S.view='finish'; }
  render(true);
}

    <div class="tl">${[['12:00','الوليمة','بيت الوالد',true],['3:00 العصر','المقيل','بيت الوالد'],['8:00 المساء','الزفة','من البيت إلى القاعة'],['10:00 المساء','الدخلة','']].map((x,i,a)=>`<div class="st"><span class="rail"><span class="node ${x[3]?'d':i===1?'c':''}">${x[3]?ic('check',13,2.6):''}</span>${i<a.length-1?`<span class="line ${x[3]?'d':''}"></span>`:''}</span><span class="body"><span class="t-h3">${x[1]} <span class="t-small">${x[0]}</span></span>${x[2]?`<span class="t-small">${x[2]}</span>`:''}</span></div>`).join('')}</div>
    <div class="sec-h"><span class="t-h3">ظروف اليوم</span><span class="t-small">باقي ${short(left)}</span></div>
    <div class="list">${envs.map(e=>`<div class="li"><button class="chk ${S.env[e[0]]?'on':''}" data-env="${e[0]}" aria-label="دفعت">${ic('check',16,2.6)}</button><span class="grow"><span class="ttl" style="${S.env[e[0]]?'text-decoration:line-through;color:var(--a-faint)':''}">${e[1]}</span><span class="t-small">${e[2]}</span></span><span class="amt">${short(e[3])}</span></div>`).join('')}</div>
    <div class="sec-h"><span class="t-h3">أرقام المزودين</span></div>
    <div class="list">${li({ic:'phone',t:'قاعة الماسة',r:'<span class="t-small num" dir="ltr">777 210 334</span>'})}${li({ic:'phone',t:'المنشد أبو أصيل',r:'<span class="t-small num" dir="ltr">733 908 112</span>'})}</div>
  </div>`};
}
function vRifdBulk(){
  return {body:`${hsub('نقل الرفد من الدفتر')}<div class="pad" style="padding-top:14px">
    <p class="t-body">اكتب الاسم والمبلغ ثم "التالي". سجّلت ${43+S.rifd.length} اسم حتى الآن.</p>
    ${rifdForm()}
    <div class="list">${S.rifd.slice(-4).reverse().map(x=>li({av:`<span class="av sm">${x.n[0]}</span>`,t:x.n,r:`<span class="amt">${short(x.a)}</span>`})).join('')}</div>
  </div>`};
}
function rifdForm(){
  return `<div class="field"><label for="rn">الاسم</label><div class="inp"><input id="rn" data-rn placeholder="مثلاً: أحمد الحاج" value="${S.rifdName}"></div></div>
  <div class="field"><label>المبلغ</label><div class="keyamts">${[5000,10000,20000,50000].map(a=>`<button class="${S.rifdAmt===a?'on':''}" data-ramt="${a}">${short(a)}</button>`).join('')}</div></div>
  <button class="btn pri block" data-act="rifdSave">احفظ والتالي</button>`;
}
function vFinish(){
  return {body:`<div class="finish">
    <div class="goldline"></div>
    <h1>سددت كل ديون عرسك</h1>
    <p style="margin:0;font-size:16px;line-height:1.8;color:var(--a-on-primary-muted)">من الاتفاق في رمضان 2024 إلى آخر قسط في أكتوبر 2027. ثلاث سنوات وسبعة شهور.</p>
    <div class="stats" style="grid-template-columns:1fr 1fr">
      <div class="stat" style="background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.14)"><span class="l" style="color:var(--a-on-primary-muted)">تكلفة العرس</span><span class="v" style="color:var(--a-on-primary)">7.38 مليون</span></div>
      <div class="stat" style="background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.14)"><span class="l" style="color:var(--a-on-primary-muted)">الرفد اللي رديته</span><span class="v" style="color:var(--a-gold)">14 من 46</span></div>
    </div>
    <p style="margin:0;font-size:14px;color:var(--a-on-primary-muted)">دفتر الرفد يبقى معك. نذكرك لما يقرب عرس أي واحد أعطاك.</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px"><button class="btn onp block" data-act="okToast">احفظ الخطة كذكرى</button><button class="btn lite block" data-stage-back>رجوع للرحلة</button></div>
  </div>`};
}

/* ---------- sheets ---------- */
function sheetHTML(){
  if(!S.sheet) return '';
  let c='';
  if(S.sheet==='quick') c=`<div class="t-h2">وش تبي تسجل؟</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      ${[['pay','receipt','دفعة','دفعت لمزود أو قسط','m'],['rifd','book','رفد','أحد أعطاك في العرس','p'],['exp','wallet','مصروف','شيء اشتريته','c'],['fund','people','مساعدة أو دين','من الأهل أو غيرهم','g']].map(x=>`<button class="card tap" data-act="${x[0]==='pay'?'quickPay':x[0]==='rifd'?'rifdSheet':'okToast'}" style="gap:8px"><span class="ic ${x[4]}">${ic(x[1])}</span><span class="t-h3">${x[2]}</span><span class="t-small">${x[3]}</span></button>`).join('')}
    </div>`;
  if(S.sheet==='pay'){
    const st=S.stage;
    const lbl = st===3?'قسط الشرط':st===9?'قسط عبدالله':'دفعة القاعة الثانية';
    const amt = st===3?'300,000':st===9?'50,000':'250,000';
    c=`<div class="t-h2">سجّل دفعة</div>
    <div class="field"><label>لأي بند</label><div class="inp"><span style="flex:1;font-weight:600;color:var(--a-ink)">${lbl}</span>${ic('chev',16)}</div></div>
    <div class="field"><label for="pa">المبلغ</label><div class="inp"><input id="pa" value="${amt}" inputmode="numeric"><span class="suf">ريال</span></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label>من دفع</label><div class="inp"><span style="flex:1">أنا</span></div></div><div class="field"><label>التاريخ</label><div class="inp"><span style="flex:1">اليوم</span></div></div></div>
    <button class="opt" data-act="okToast"><span class="ic">${ic('receipt')}</span><span class="grow"><span class="ttl">صوّر الإيصال</span><span class="t-small">يبقى خاص فيك</span></span></button>
    <button class="btn pri block" data-act="savePay">احفظ الدفعة</button>`;
  }
  if(S.sheet==='rifd') c=`<div class="t-h2">سجّل رفد</div>${S.stage===7?`<div class="offline">${ic('wifioff',18)} بدون إنترنت. بينحفظ ويتزامن لاحقاً</div>`:''}${rifdForm()}<div class="t-small">آخر تسجيل: ${S.rifd[S.rifd.length-1].n}، ${short(S.rifd[S.rifd.length-1].a)}</div>`;
  if(S.sheet==='gap'){ const T=totals(); c=`<div class="t-h2">ناقصك ${short(T.gap)} قبل العرس</div>
    <p class="t-body">الباقي ${short(T.left)}. معك ${short(T.cash)}، والوالد وعد بـ500 ألف. هذي طرق تقفل الفجوة:</p>
    <div class="list">${li({ic:'scissors',c:'p',t:'خفّف بنود',s:'مثلاً غرفة النوم بالتقسيط بعد العرس: يتأجل 600 ألف',go:'map'})}${li({ic:'people',c:'g',t:'سجّل مساعدة موعودة',s:'من أخ أو خال أو عم'})}${li({ic:'coin',c:'a',t:'سجّل دين جديد',s:'بجدول سداد واضح، ويدخل في تاريخ تحررك'})}</div>
    <div class="card" style="background:var(--a-quiet)"><span class="t-small">الرفد المتوقع يوم العرس ما نحسبه قبل ما يوصل، عشان ما تبني على فلوس مو في يدك.</span></div>`; }
  if(S.sheet==='ai') c=`<div class="crow"><span class="ic p">${ic('spark')}</span><span class="t-h2">المساعد</span></div>
    <div class="card" style="background:var(--a-quiet)"><span style="font-weight:600;color:var(--a-ink)">وش ممكن أخفف بدون ما يخرب العرس؟</span></div>
    <div class="card"><span class="t-small" style="color:var(--a-text);font-size:14px;line-height:1.8">من بنودك: التصوير عندك 3 عروض، أرخصها يوفر 20 ألف عن البند. غرفة النوم لو أجلت 3 أقساط لبعد العرس يخف عليك 600 ألف قبل الموعد. القات للمقيل ممكن يتقسم مع الأهل. ما أقترح تلمس الوليمة لأنها مرتبطة بعدد الضيوف.</span><span class="t-small">مبني على بنودك وأسعار صنعاء في اعّرست. ما يشوف بنودك الخاصة.</span></div>`;
  return `<div class="ov" data-close><div class="sheet" role="dialog" aria-modal="true"><span class="grab"></span>${c}</div></div>`;
}

/* ---------- render ---------- */
const VIEWS = {welcome:vWelcome, ob_role:vRole, ob_stage:vStage, ob_money:vObMoney, map:vMap, phone:vPhone, lockset:vLock, home:vHome, journey:vJourney, tasks:vTasks, agree:vAgree, notif:vNotif, money:vMoney, item:vItem, people:vPeople, market:vMarket, provider:vProvider, compare:vCompare, week:vWeek, day:vDay, rifdbulk:vRifdBulk, finish:vFinish};
const app = document.getElementById('app');
let lastKey='';
function render(anim){
  const v = VIEWS[S.view]();
  const scr = app.querySelector('.scr');
  const keep = (!anim && scr) ? scr.scrollTop : 0;
  app.innerHTML = `
    <div class="sbar"><span class="num">11:17</span><span class="r">${ic('wifioff',14,2)}<span style="width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;display:inline-block;position:relative"><i style="position:absolute;inset:1.5px;right:7px;background:currentColor;border-radius:1px"></i></span></span></div>
    <div class="scr ${anim?'screen-in':''}">${v.body}</div>
    ${v.act?`<div class="actbar">${v.act}</div>`:''}
    ${v.tabbed?`<button class="fab" data-act="quick">${ic('plus',22,2.4)} سجّل</button>
    <nav class="nav">${[['home','home','الرئيسية'],['money','wallet','المال'],['people','people','الناس'],['market','store','السوق']].map(([k,i,l])=>`<button class="${S.tab===k?'on':''}" data-go="${k}"><span class="nb">${ic(i,22)}</span>${l}</button>`).join('')}</nav>`:''}
    ${sheetHTML()}
    ${S.toast?`<div class="toast" role="status">${ic('check',20,2.4)}<span>${S.toast}</span></div>`:''}`;
  if(!anim){ const n=app.querySelector('.scr'); if(n) n.scrollTop=keep; }
  renderGuide();
}

/* ---------- guide ---------- */
function curKey(){
  if(['money','people','market'].includes(S.view)) return S.view+':'+S.sub[S.view];
  return S.view;
}
function guideHTML(){
  const n = NOTE[S.view] || NOTE.home;
  const k = curKey();
  return `
  <div class="g-brand"><h1>رحلة العريس في اعّرست</h1><p>عرض تفاعلي للتطبيق بعد إعادة التصميم. اضغط داخل الجوال كأنه التطبيق الحقيقي. الأرقام تقديرية بأسعار صنعاء.</p></div>
  <section class="g-sec"><h2>انتقل في الزمن</h2><p class="g-hint">اختر مرحلة، والرئيسية تتغير حسبها.</p>
    <div class="stages">${STAGES.map((s,i)=>`<button class="${S.stage===i&&S.view!=='finish'?'on':''}" data-stage="${i}">${s.n}</button>`).join('')}<button class="${S.view==='finish'?'on':''}" data-act="finishJourney">النهاية</button></div></section>
  <section class="g-sec g-note"><h2>${n.g}: ${n.t}</h2><p class="q">"${n.q}"</p>
    <dl><div><dt>ليش كذا</dt><dd>${n.why}</dd></div><div><dt>وش يتغير عن التطبيق الحالي</dt><dd>${n.ch}</dd></div></dl></section>
  <section class="g-sec"><h2>كل الشاشات</h2><div class="jump">${JUMPS.map(([g,arr])=>`<div class="grp">${g}</div>${arr.map(([key,l])=>`<button class="${k===key?'on':''}" data-jump="${key}">${l}</button>`).join('')}`).join('')}</div></section>`;
}
function renderGuide(){
  const h = guideHTML();
  document.getElementById('guideDesk').innerHTML = h;
  const gp = document.getElementById('gpanel');
  if(!document.getElementById('gsheet').hidden) gp.innerHTML = `<div class="guide">${h}</div><button class="btn pri block" data-gclose style="background:var(--pg-accent);color:var(--pg-card)">رجوع للعرض</button>`;
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-go],[data-back],[data-sub],[data-act],[data-pick],[data-light],[data-stage],[data-jump],[data-task],[data-tf],[data-ev],[data-rs],[data-env],[data-ramt],[data-confirm],[data-close],[data-gclose],[data-stage-back],#gtoggle');
  if(!t) return;
  const sheet = document.getElementById('gsheet');
  if(t.id==='gtoggle'){ sheet.hidden=false; renderGuide(); return; }
  if(t.hasAttribute('data-gclose')){ sheet.hidden=true; return; }
  if(t.hasAttribute('data-close')){ if(e.target===t){ S.sheet=null; render(); } return; }
  const d=t.dataset;
  if(d.jump){ sheet.hidden=true; const key=d.jump;
    if(['welcome','ob_role','ob_stage','ob_money','map','phone','lockset'].includes(key)){ S.hist=[]; S.view=key; render(true); return; }
    if(key==='finish'){ S.view='finish'; render(true); return; }
    if(['week','day','rifdbulk'].includes(key)){ S.stage = key==='week'?6:key==='day'?7:8; S.tab='home'; S.hist=[{view:'home',tab:'home'}]; S.view=key; render(true); return; }
    if(key.includes(':')||TABS.includes(key)){ if(S.stage<1) S.stage=5; go(key,false); return; }
    if(S.stage<1) S.stage=5;
    S.hist=[{view:S.tab,tab:S.tab}]; S.view=key; render(true); return; }
  if(d.stage!==undefined){ sheet.hidden=true; setStage(+d.stage); return; }
  if(t.hasAttribute('data-stage-back')){ setStage(9); return; }
  if(d.go){ go(d.go); return; }
  if(t.hasAttribute('data-back')){ back(); return; }
  if(d.sub){ const [k,v]=d.sub.split(':'); S.sub[k]=v; render(); return; }
  if(d.pick){ const [k,v]=d.pick.split(':'); S.ob[k]=v; render(); return; }
  if(d.light){ S.lighten[d.light]=!S.lighten[d.light]; render(); return; }
  if(d.task){ S.tasks[d.task]=!S.tasks[d.task]; render(); return; }
  if(d.tf){ S.taskFilter=d.tf; render(); return; }
  if(d.ev){ S.guestEvent=d.ev; render(); return; }
  if(d.rs){ S.sub.rifd=d.rs; render(); return; }
  if(d.env){ S.env[d.env]=!S.env[d.env]; render(); return; }
  if(d.ramt){ S.rifdAmt=+d.ramt; render(); return; }
  if(d.confirm){ S.conf[d.confirm]=true; toast('جهزنا الرسالة في واتساب: "نأكد موعدنا يوم الخميس 18 فبراير". لما يرد، علّمه مؤكد.'); return; }
  const a=d.act;
  if(a==='quick'){ S.sheet='quick'; render(); }
  else if(a==='quickPay'){ S.sheet='pay'; render(); }
  else if(a==='rifdSheet'){ S.sheet='rifd'; render(); }
  else if(a==='gapSheet'){ S.sheet='gap'; render(); }
  else if(a==='askAI'){ S.sheet='ai'; render(); }
  else if(a==='savePay'){
    S.sheet=null;
    if(S.stage===5 && !S.hallPaid){ S.hallPaid=true; S.tasks.t4=true; S.hist=[]; S.view='home'; S.tab='home'; render(true); toast('انسجلت دفعة القاعة. باقي عليها 300 ألف قبل العرس. وشوف الكرت الجديد في الرئيسية.'); }
    else { render(); toast('انسجلت الدفعة، والأرقام تحدثت.'); }
  }
  else if(a==='choosePhoto'){ S.photoChosen=true; S.tasks.t2=true; render(); toast('اخترت عدسة صنعاء. بند التصوير صار 180 ألف، والعربون 50 ألف قبل 1 نوفمبر.'); }
  else if(a==='rifdSave'){ const inp=app.querySelector('[data-rn]'); const name=(inp&&inp.value.trim())||'ضيف بدون اسم'; S.rifd.push({n:name,a:S.rifdAmt}); S.rifdName=''; render(); toast(`انحفظ: ${name}، ${short(S.rifdAmt)}`); const n=app.querySelector('[data-rn]'); if(n) n.focus(); }
  else if(a==='saveAgree'){ S.stage=2; S.hist=[]; S.view='home'; S.tab='home'; render(true); toast('انحفظ الاتفاق. صار عندك 4 بنود، والذهب محسوب بالجرام.'); }
  else if(a==='finishOb'){ const m={none:0,agreed:1,paying:3,date:5}; S.stage=m[S.ob.st]??5; S.hist=[]; S.view='home'; S.tab='home'; render(true); toast('انحفظت خطتك. أهلاً محمد.'); }
  else if(a==='finishJourney'){ sheet.hidden=true; S.view='finish'; S.hist=[]; render(true); }
  else if(a==='toProvider'){ toast('المزود يروح لبوابة المزود: طلبات تنتظر رده، حجوزاته وتقويمه، وملفه.'); }
  else if(a==='rifdBack'){ toast('انسجل إنك رديت 20 ألف لصالح.'); }
  else if(a==='dismiss'){ toast('بنذكرك قبل العرس بيوم.'); }
  else if(a==='newTask'){ toast('إضافة مهمة: الاسم والموعد والمسؤول، وخاصة أو لا. والباقي اختياري.'); }
  else { toast('هذا الزر في العرض للتوضيح فقط.'); }
});
document.addEventListener('input', e=>{
  const n=e.target.dataset && e.target.dataset.num;
  if(n){ const v=+e.target.value.replace(/[^0-9]/g,''); S.ob[n]=v||0; }
  if(e.target.hasAttribute && e.target.hasAttribute('data-rn')) S.rifdName=e.target.value;
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(S.sheet){S.sheet=null;render();} document.getElementById('gsheet').hidden=true; }});

render(true);
})();
</script>

</body>
</html>
