org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin incremental caches cannot safely relativize sources when the project
# is on D: and Flutter's Pub cache is on C:. A clean non-incremental compiler
# pass is slower but avoids daemon cache corruption and fallback stack traces.
kotlin.incremental=false
